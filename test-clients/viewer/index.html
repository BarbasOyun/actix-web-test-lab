<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Stream Viewer</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #fff;
            padding: 2rem;
        }

        video {
            width: 640px;
            height: 480px;
            background: #000;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h2>Live Stream Watcher</h2>
    <video id="player" autoplay controls playsinline></video>
    <p id="status">Connecting...</p>

    <script>
        const video = document.getElementById('player');
        const status = document.getElementById('status');

        // 1. Initialize MediaSource for WebM VP8 video
        const mediaSource = new MediaSource();
        video.src = URL.createObjectURL(mediaSource);

        mediaSource.addEventListener('sourceopen', () => {
            console.log("---Starting Video");

            // Streamer + Watcher = video/webm; codecs=vp8
            const sourceBuffer = mediaSource.addSourceBuffer('video/webm; codecs=vp8');

            const queue = [];
            let isUpdating = false;

            // Append buffered chunks sequentially without overlapping updates
            function appendNext() {
                if (queue.length > 0 && !sourceBuffer.updating) {
                    const chunk = queue.shift();
                    sourceBuffer.appendBuffer(chunk); // load bytes from websocket in the video
                    console.log("Received image");
                }
            }

            sourceBuffer.addEventListener('updateend', appendNext);
            sourceBuffer.addEventListener('error', (e) => {
                console.error("SourceBuffer element error:", e);
                isSourceBufferValid = false;
            });

            // 2. Connect to the WebSocket watch endpoint
            const ws = new WebSocket('wss://127.0.0.1:8080/watch');
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => { status.innerText = 'Connected - Watching live...'; };
            ws.onclose = () => { status.innerText = 'Disconnected'; };

            ws.onmessage = (event) => {
                // console.log("Message");
                if (event.data instanceof ArrayBuffer) {
                    queue.push(event.data);
                    appendNext();
                }
            };
        });
    </script>
</body>

</html>
