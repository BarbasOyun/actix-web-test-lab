<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Camera WS Video Stream Test</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
            background: #1a1a1a;
            color: #fff;
        }

        video {
            width: 480px;
            height: 360px;
            background: #000;
            border-radius: 8px;
        }

        button {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            margin-right: 0.5rem;
        }

        #log {
            background: #111;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            height: 150px;
            overflow-y: auto;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <h2>Webcam Binary WebSocket Streamer</h2>

    <video id="webcam" autoplay playsinline muted></video>
    <br /><br />

    <button id="startBtn">Start Streaming</button>
    <button id="stopBtn" disabled>Stop</button>

    <div id="log"></div>

    <script>
        const logEl = document.getElementById('log');
        function log(msg) {
            logEl.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br/>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        let socket, mediaRecorder, stream;
        var keyframesInterval;

        /// Start streaming web cam
        async function startStream() {
            try {
                connectToWebsocket()

                // Start webcam
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: false, video: {
                        width: { max: 100 }, // 100 1920
                        height: { max: 100 }, // 100 1080
                        frameRate: { max: 5 } // 5 24
                    }
                });
                document.getElementById('webcam').srcObject = stream;

                // Send bytes on websocket
                startRecorder(stream)

                // send keyframe every 2 sec
                keyframesInterval = setInterval(() => {
                    // Stop recorder
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                    startRecorder(stream); // send fresh keyframe
                }, 2000);
            } catch (err) {
                log(`Error: ${err.message}`);
            }
        }

        function connectToWebsocket() {
            socket = new WebSocket('wss://127.0.0.1:8080/stream');
            socket.binaryType = 'arraybuffer'; // Handle raw bytes

            socket.onopen = () => log('WebSocket Connected');
            socket.onerror = (e) => log('WebSocket Error');
            socket.onclose = () => log('WebSocket Closed');
        }

        function startRecorder(stream) {
            // Encode Video Chunks (WebM format)
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp8' });

            mediaRecorder.ondataavailable = async (event) => {
                if (event.data.size > 0 && socket.readyState === WebSocket.OPEN) {
                    // Convert Blob to ArrayBuffer and send as binary frame
                    const buffer = await event.data.arrayBuffer();

                    log(`Sending binary chunk: ${buffer.byteLength} bytes`);
                    socket.send(buffer);
                    // log(`Sent binary chunk: ${buffer.byteLength} bytes`);
                }
            };

            // Emit image bytes every Xms
            mediaRecorder.start(100);
        }

        function stopStream() {
            clearInterval(keyframesInterval);

            if (mediaRecorder) mediaRecorder.stop();
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (socket) socket.close();
            log('Streaming stopped');
        }

        // Setup buttons
        document.getElementById('startBtn').onclick = async () => {
            startStream();
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
        };
        document.getElementById('stopBtn').onclick = () => {
            stopStream()
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        };
    </script>
</body>

</html>
