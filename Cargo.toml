[package]
name = "actix-test-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.15.0", features = ["rustls-0_23"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0"
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# Web Socket
actix-ws = "0.4"
tokio = { version = "1", features = ["macros", "full"] }
futures-util = "0.3"